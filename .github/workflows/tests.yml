name: tests

on:
  push:
  pull_request:

jobs:
  core:
    # NumPy / OpenCV logic only; torch parity tests skip here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless pyyaml matplotlib pytest
      - run: python -m pytest -q

  parity:
    # Checks the NumPy post-processing against torchvision (CPU wheels).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy opencv-python-headless pyyaml matplotlib pytest
      - run: python -m pytest -q tests/test_torch_parity.py
